session: rails
root: ~/repos/fintoc-rails
attach: true

before_start:
  - doppler setup --no-interactive --project fintoc-rails --config dev
  - rbenv install --skip-existing "$(cat .ruby-version)" >/dev/tty 2>&1
  - docker compose up --detach --wait >/dev/tty 2>&1
  - doppler run -- rbenv exec bundle install >/dev/tty 2>&1

stop:
  - docker compose down

windows:
  - name: shell
    selected: true

  - name: agent
    commands:
      - opencode

  - name: webserver
    commands:
      - doppler run -- bundle exec rails server --binding 0.0.0.0

  - name: databases
    commands:
      - docker compose logs --follow
